<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 130" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#7b61ff" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#7b61ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Cormorant+Garamond:ital,wght@1,500&amp;family=JetBrains+Mono:wght@600&amp;display=swap');
      .title-text {
        font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 2.5px;
        fill: url(#textGrad);
      }
      .subtitle-text {
        font-family: 'Cormorant Garamond', 'Garamond', serif;
        font-style: italic;
        font-size: 14.5px;
        letter-spacing: 0.8px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 2px;
        fill: #7b61ff;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="956" height="126" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Left Accent Bar -->
  <rect x="18" y="25" width="4" height="80" rx="2" fill="#7b61ff" filter="url(#glow)"/>

  <!-- Top Tag Badge -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="105" height="18" rx="4" fill="#7b61ff" fill-opacity="0.1" stroke="#7b61ff" stroke-opacity="0.3" stroke-width="0.8"/>
    <text x="8" y="13" class="tag-text">◈ SECTION 02</text>
  </g>

  <!-- Main Title -->
  <text x="36" y="75" class="title-text">ENGINEERING & TECHNOLOGY ARSENAL</text>

  <!-- Subtitle -->
  <text x="36" y="103" class="subtitle-text">Classical Control Theory  •  Bare-Metal Silicon  •  Physical AI Middleware</text>

  <!-- Right Decorative Geometric Insignia -->
  <g transform="translate(900, 65)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#1f2937" stroke-width="1"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#7b61ff" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="4" fill="#7b61ff" filter="url(#glow)"/>
    <line x1="-30" y1="0" x2="-25" y2="0" stroke="#7b61ff" stroke-opacity="0.6" stroke-width="1.5"/>
    <line x1="25" y1="0" x2="30" y2="0" stroke="#7b61ff" stroke-opacity="0.6" stroke-width="1.5"/>
  </g>
</svg>
