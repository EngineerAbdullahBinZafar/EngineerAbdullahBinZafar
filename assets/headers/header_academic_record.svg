<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 130" width="960" height="130">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#7b61ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: 2px;
        fill: url(#textGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13.5px;
        letter-spacing: 0.5px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #00d4ff;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="956" height="126" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Left Accent Cyan Bar -->
  <rect x="18" y="25" width="4" height="80" rx="2" fill="#00d4ff"/>

  <!-- Top Tag Badge -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="112" height="20" rx="4" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="10" y="14" class="tag-text">◈ SECTION 08</text>
  </g>

  <!-- Main Title -->
  <text x="36" y="74" class="title-text">ACADEMIC MERIT & LABORATORY HARDWARE</text>

  <!-- Subtitle -->
  <text x="36" y="101" class="subtitle-text">Top Merit Scholar  •  20 A/A+ Grades Across 6 Semesters  •  100% Physical Build Rate</text>

  <!-- Right Decorative Cyber-Physical Accents -->
  <g transform="translate(900, 65)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#1f2937" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#00d4ff" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="4" fill="#00d4ff"/>
    <line x1="-30" y1="0" x2="-25" y2="0" stroke="#00d4ff" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="25" y1="0" x2="30" y2="0" stroke="#00d4ff" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>
</svg>