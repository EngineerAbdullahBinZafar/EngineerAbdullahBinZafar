<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="40%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0f1923"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b61ff"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="220"/>
    <line x1="300" y1="0" x2="300" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="750" y1="0" x2="750" y2="220"/>
  </g>

  <!-- Animated accent line top -->
  <rect x="0" y="0" width="900" height="3" fill="url(#accent)" opacity="0.9"/>

  <!-- Animated accent line bottom -->
  <rect x="0" y="217" width="900" height="3" fill="url(#accent)" opacity="0.9"/>

  <!-- Left circuit decoration -->
  <g opacity="0.25" stroke="#00d4ff" stroke-width="1" fill="none">
    <circle cx="40" cy="110" r="18" filter="url(#glow)"/>
    <circle cx="40" cy="110" r="10"/>
    <circle cx="40" cy="110" r="3" fill="#00d4ff"/>
    <line x1="58" y1="110" x2="80" y2="110"/>
    <line x1="80" y1="110" x2="80" y2="90"/>
    <line x1="80" y1="90" x2="100" y2="90"/>
    <line x1="22" y1="110" x2="10" y2="110"/>
    <line x1="10" y1="110" x2="10" y2="140"/>
    <line x1="10" y1="140" x2="30" y2="140"/>
    <rect x="30" y="133" width="14" height="14" rx="2"/>
  </g>

  <!-- Right circuit decoration -->
  <g opacity="0.25" stroke="#7b61ff" stroke-width="1" fill="none">
    <circle cx="860" cy="110" r="18" filter="url(#glow)"/>
    <circle cx="860" cy="110" r="10"/>
    <circle cx="860" cy="110" r="3" fill="#7b61ff"/>
    <line x1="842" y1="110" x2="820" y2="110"/>
    <line x1="820" y1="110" x2="820" y2="130"/>
    <line x1="820" y1="130" x2="800" y2="130"/>
    <line x1="878" y1="110" x2="890" y2="110"/>
    <line x1="890" y1="110" x2="890" y2="80"/>
    <line x1="890" y1="80" x2="870" y2="80"/>
    <rect x="856" y="73" width="14" height="14" rx="2"/>
  </g>

  <!-- Name -->
  <text x="450" y="72" font-family="'Courier New', monospace" font-size="38" font-weight="900" text-anchor="middle" fill="url(#accent)" filter="url(#glow2)" letter-spacing="6">ABDULLAH BIN ZAFAR</text>

  <!-- Title line -->
  <text x="450" y="105" font-family="'Courier New', monospace" font-size="14" text-anchor="middle" fill="#94a3b8" letter-spacing="3">MECHATRONICS  ·  CONTROL SYSTEMS  ·  EMBEDDED FIRMWARE</text>

  <!-- Accent bar -->
  <rect x="200" y="118" width="500" height="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Metrics row -->
  <text x="230" y="148" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" fill="#00d4ff" filter="url(#glow)">88/88 TESTS</text>
  <text x="230" y="163" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#475569">AUTOMOTIVE CBF</text>

  <text x="360" y="148" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" fill="#7b61ff" filter="url(#glow)">269.7 µs</text>
  <text x="360" y="163" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#475569">LOOP LATENCY</text>

  <text x="450" y="148" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" fill="#f59e0b" filter="url(#glow)">+35.65% RMS</text>
  <text x="450" y="163" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#475569">RIDE COMFORT</text>

  <text x="545" y="148" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" fill="#10b981" filter="url(#glow)">12,000+ Hz</text>
  <text x="545" y="163" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#475569">CBF SAFETY RATE</text>

  <text x="675" y="148" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" fill="#ff6b35" filter="url(#glow)">UET LAHORE</text>
  <text x="675" y="163" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#475569">TOP MERIT SCHOLAR</text>

  <!-- Vertical separators -->
  <line x1="290" y1="135" x2="290" y2="175" stroke="#1e293b" stroke-width="1"/>
  <line x1="405" y1="135" x2="405" y2="175" stroke="#1e293b" stroke-width="1"/>
  <line x1="495" y1="135" x2="495" y2="175" stroke="#1e293b" stroke-width="1"/>
  <line x1="610" y1="135" x2="610" y2="175" stroke="#1e293b" stroke-width="1"/>

  <!-- Bottom quote -->
  <text x="450" y="202" font-family="'Courier New', monospace" font-size="10" text-anchor="middle" fill="#334155" font-style="italic">"Safety is not a feature or a soft prompt. It is a deterministic mathematical law."</text>
</svg>
