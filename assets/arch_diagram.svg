<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="cbf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>
    <linearGradient id="mpc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b61ff"/>
      <stop offset="100%" style="stop-color:#5b41df"/>
    </linearGradient>
    <linearGradient id="can" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="act" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="160" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="2" fill="#00d4ff" opacity="0.6"/>

  <!-- Title -->
  <text x="450" y="30" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" fill="#475569" letter-spacing="4">AUTOMOTIVE CHASSIS CONTROL ARCHITECTURE</text>

  <!-- Tier boxes -->
  <!-- Tier 4: CAN -->
  <rect x="30" y="50" width="175" height="80" rx="6" fill="#0d1117" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="30" y="50" width="175" height="28" rx="6" fill="url(#can)" opacity="0.15"/>
  <rect x="30" y="72" width="175" height="6" fill="url(#can)" opacity="0.08"/>
  <text x="118" y="68" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#f59e0b" font-weight="bold" filter="url(#glow)">TIER 4 — CAN TELEMETRY</text>
  <text x="118" y="86" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">AUTOSAR E2E Profile 1</text>
  <text x="118" y="100" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">Vector DBC · CRC-8</text>
  <text x="118" y="114" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">Alive Counter · socketCAN</text>

  <!-- Arrow 1 -->
  <line x1="205" y1="90" x2="230" y2="90" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="226,86 236,90 226,94" fill="#334155"/>

  <!-- Tier 3: Actuator -->
  <rect x="236" y="50" width="175" height="80" rx="6" fill="#0d1117" stroke="#10b981" stroke-width="1.5"/>
  <rect x="236" y="50" width="175" height="28" rx="6" fill="url(#act)" opacity="0.15"/>
  <text x="324" y="68" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#10b981" font-weight="bold" filter="url(#glow)">TIER 3 — ACTUATOR LAYER</text>
  <text x="324" y="86" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">Strut Saturation ±50 mm</text>
  <text x="324" y="100" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">Thermal Dynamics Model</text>
  <text x="324" y="114" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">Force Clipping &amp; Rate Limit</text>

  <!-- Arrow 2 -->
  <polygon points="412,86 422,90 412,94" fill="#334155"/>

  <!-- Tier 2: HOCBF -->
  <rect x="442" y="50" width="175" height="80" rx="6" fill="#0d1117" stroke="#7b61ff" stroke-width="1.5"/>
  <rect x="442" y="50" width="175" height="28" rx="6" fill="url(#mpc)" opacity="0.15"/>
  <text x="530" y="68" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#7b61ff" font-weight="bold" filter="url(#glow)">TIER 2 — HOCBF SAFETY</text>
  <text x="530" y="86" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">Rel. Degree r=2 Barrier</text>
  <text x="530" y="100" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">h(x) ≥ 0  ∀t ≥ 0</text>
  <text x="530" y="114" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">OSQP QP Solver · &lt;0.3 ms</text>

  <!-- Arrow 3 -->
  <polygon points="618,86 628,90 618,94" fill="#334155"/>

  <!-- Tier 1: MPC -->
  <rect x="648" y="50" width="222" height="80" rx="6" fill="#0d1117" stroke="#00d4ff" stroke-width="1.5"/>
  <rect x="648" y="50" width="222" height="28" rx="6" fill="url(#cbf)" opacity="0.15"/>
  <text x="759" y="68" font-family="'Courier New', monospace" font-size="9" text-anchor="middle" fill="#00d4ff" font-weight="bold" filter="url(#glow)">TIER 1 — MPC PLANNER (100 Hz)</text>
  <text x="759" y="86" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">DARE Infinite-Horizon LQR</text>
  <text x="759" y="100" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">ISO 8608 Road Preview</text>
  <text x="759" y="114" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#94a3b8">+35.65% Comfort · 269.7 µs</text>

  <!-- Connecting lines -->
  <line x1="411" y1="90" x2="442" y2="90" stroke="#334155" stroke-width="1.5"/>
  <line x1="617" y1="90" x2="648" y2="90" stroke="#334155" stroke-width="1.5"/>

  <!-- Bottom status bar -->
  <rect x="30" y="143" width="840" height="12" rx="3" fill="#0d1117" stroke="#1e293b" stroke-width="1"/>
  <rect x="30" y="143" width="840" height="12" rx="3" fill="#00d4ff" opacity="0.07"/>
  <text x="450" y="152" font-family="'Courier New', monospace" font-size="7.5" text-anchor="middle" fill="#475569" letter-spacing="2">88/88 TESTS PASSED  ·  100% GREEN  ·  ISO 8608 Class A Road  ·  Rolls-Royce Ghost / BMW 7-Series Platform</text>
</svg>
